extends: capitalization
message: "'%s' should use sentence case."
level: warning
scope: heading
match: $sentence
indicators:
  - ":"
exceptions:
  - I
  - Git
  - Hugo
  - GitHub
  - GitBook
  - Vale
  - API
  - Crowdin
  - Stoplight
  - Technical Writer
  - Frontend Developer
  - Javier
  - check-image-naming
  - auto-update-pr
  - stale-pr-notice
  - style-check
  - voice-and-tone
  - site-updates
  - GitHub Actions
