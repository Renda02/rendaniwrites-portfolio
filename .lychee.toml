# Lychee link checker config — https://lychee.cli.rs/usage/config/

# Some sites return non-2xx to bots/crawlers even though the link works
# for a real visitor — don't fail the build on those. (999 is LinkedIn's
# bot-block status.)
accept = ["200..=299", "403", "429", "999"]

exclude = [
  "^mailto:",
]

# Needed to resolve root-relative links (e.g. /blog/) against the built
# site directory when scanning local files.
root_dir = "./public"

# Absolute links to the site's own domain (e.g. in RSS/tag pages) should
# be resolved against the local build instead of hitting the network —
# otherwise they're indistinguishable from external links and can fail
# in CI due to network/firewall restrictions even though the page exists.
base_url = "https://rendaniwrites.com"

max_retries = 3
retry_wait_time = 2
timeout = 20
