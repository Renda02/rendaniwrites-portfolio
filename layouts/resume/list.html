{{ define "main" }}
<div class="container work-page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ if .Pages }}
  <ul class="page-list__items">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ if .Description }}<p>{{ .Description }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
<script>
  window.addEventListener('beforeprint', function () {
    document.querySelectorAll('.resume-collapse').forEach(function (d) { d.open = true; });
  });
</script>
{{ end }}
